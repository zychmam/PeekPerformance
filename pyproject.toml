[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peek-performance"
version = "0.1.0"
description = "Analyze Counter-Strike 2 demo files locally and explore player and match statistics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31,<3",
    "streamlit>=1.30,<2",
    "pandas>=2.1,<3",
    "plotly>=5.18,<6",
    "demoparser2>=0.41,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.2,<1",
    "mypy>=1.8,<2",
    "types-requests>=2.31,<3",
]

[project.scripts]
peek-performance = "src.gui.app:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
